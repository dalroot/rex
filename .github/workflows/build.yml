name: Build & Publish Release, Docker, APT, RPM

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Multi-Platform Binaries & Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Tidy Go Modules
        run: |
          cd rex-node
          go mod tidy
          cd ../rex-cli
          go mod tidy

      - name: Build Linux amd64 & arm64
        run: |
          mkdir -p dist
          # Build rex-node daemon
          cd rex-node
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/rex-node-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/rex-node-linux-arm64 .
          cd ../rex-cli
          # Build rex-cli interactive client
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/rex-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/rex-linux-arm64 .
          cd ..
          # Generate SHA-256 checksums
          cd dist
          sha256sum rex-node-linux-amd64 > rex-node-linux-amd64.sha256
          sha256sum rex-node-linux-arm64 > rex-node-linux-arm64.sha256
          sha256sum rex-linux-amd64 > rex-linux-amd64.sha256
          sha256sum rex-linux-arm64 > rex-linux-arm64.sha256
          cd ..

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repo Name for Docker
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/rex-node:latest
            ghcr.io/${{ env.REPO_LOWER }}/rex-node:v2.5.0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v2.5.0' }}
          name: REX Release ${{ github.ref_name || 'v2.5.0' }}
          files: |
            dist/rex-node-linux-amd64
            dist/rex-node-linux-amd64.sha256
            dist/rex-node-linux-arm64
            dist/rex-node-linux-arm64.sha256
            dist/rex-linux-amd64
            dist/rex-linux-amd64.sha256
            dist/rex-linux-arm64
            dist/rex-linux-arm64.sha256
